[package]
name = "facturapro"
version = "0.1.0"
description = "FacturaPro — generador de facturas para macOS"
authors = ["aifotos"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "facturapro_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"

# Base de datos local SQLite (reemplaza a Supabase)
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
# Dialogos nativos de macOS: "Guardar PDF como..."
tauri-plugin-dialog = "2"
# Abrir el PDF generado o enlaces en el navegador
tauri-plugin-opener = "2"
# Escribir el PDF en disco
tauri-plugin-fs = "2"
